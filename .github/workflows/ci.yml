name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Build
        run: dotnet build ECommerce.sln --configuration Release --no-restore --maxcpucount:1

      - name: Test
        run: dotnet test ECommerce.sln --configuration Release --no-build --maxcpucount:1 --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate scripts, Compose, and secret patterns
        shell: pwsh
        run: ./scripts/validate-local.ps1 -SkipBuild

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - backend
      - frontend
      - repository-validation
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build all application images
        run: docker compose build
