x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Docker
  IdentityClient__BaseUrl: http://identity-api:8080
  CatalogClient__BaseUrl: http://catalog-api:8080

x-worker-env: &worker-env
  DOTNET_ENVIRONMENT: Docker

x-managed-env: &managed-env
  ConnectionStrings__CatalogDb: ${ConnectionStrings__CatalogDb:-}
  ConnectionStrings__BasketDb: ${ConnectionStrings__BasketDb:-}
  ConnectionStrings__OrderingDb: ${ConnectionStrings__OrderingDb:-}
  ConnectionStrings__OrderingSagaDb: ${ConnectionStrings__OrderingSagaDb:-}
  ConnectionStrings__InventoryDb: ${ConnectionStrings__InventoryDb:-}
  ConnectionStrings__PaymentDb: ${ConnectionStrings__PaymentDb:-}
  ConnectionStrings__ShippingDb: ${ConnectionStrings__ShippingDb:-}
  ConnectionStrings__NotificationDb: ${ConnectionStrings__NotificationDb:-}
  ConnectionStrings__IdentityDb: ${ConnectionStrings__IdentityDb:-}
  RabbitMq__ConnectionString: ${RabbitMq__ConnectionString:-}
  Cloudinary__CloudName: ${Cloudinary__CloudName:-}
  Cloudinary__ApiKey: ${Cloudinary__ApiKey:-}
  Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:-}
  Auth__Authority: ${Auth__Authority:-}
  Auth__Audience: ${Auth__Audience:-}
  Auth__RequireHttpsMetadata: ${Auth__RequireHttpsMetadata:-true}
  Observability__ServiceNamespace: ${Observability__ServiceNamespace:-ECommerce}
  Observability__OtlpEndpoint: ${Observability__OtlpEndpoint:-http://otel-collector:4317}
  Observability__RedactionEnabled: ${Observability__RedactionEnabled:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

x-env-file: &env-file
  - path: .env
    required: false

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  loki:
    image: grafana/loki:3.7.3
    container_name: ecommerce-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "13100:3100"

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: ecommerce-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: ecommerce-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "${OTEL_COLLECTOR_HEALTH_HOST_PORT:-14133}:13133"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: ecommerce-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  catalog-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Catalog/ECommerce.Catalog.Api/ECommerce.Catalog.Api.csproj
        ASSEMBLY_NAME: ECommerce.Catalog.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
    restart: unless-stopped
    ports:
      - "${CATALOG_API_HOST_PORT:-15283}:8080"

  basket-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Basket/ECommerce.Basket.Api/ECommerce.Basket.Api.csproj
        ASSEMBLY_NAME: ECommerce.Basket.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      CatalogClient__TimeoutSeconds: ${CatalogClient__TimeoutSeconds:-5}
      Redis__Endpoint: redis:6379
      Redis__BasketTtlHours: ${Redis__BasketTtlHours:-72}
    restart: unless-stopped
    ports:
      - "${BASKET_API_HOST_PORT:-15041}:8080"
    depends_on:
      redis:
        condition: service_started

  ordering-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Ordering/ECommerce.Ordering.Api/ECommerce.Ordering.Api.csproj
        ASSEMBLY_NAME: ECommerce.Ordering.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      CatalogClient__TimeoutSeconds: ${CatalogClient__TimeoutSeconds:-5}
    restart: unless-stopped
    ports:
      - "${ORDERING_API_HOST_PORT:-15265}:8080"

  inventory-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Inventory/ECommerce.Inventory.Api/ECommerce.Inventory.Api.csproj
        ASSEMBLY_NAME: ECommerce.Inventory.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      CatalogClient__TimeoutSeconds: ${CatalogClient__TimeoutSeconds:-5}
    restart: unless-stopped
    ports:
      - "${INVENTORY_API_HOST_PORT:-15054}:8080"

  payment-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Payment/ECommerce.Payment.Api/ECommerce.Payment.Api.csproj
        ASSEMBLY_NAME: ECommerce.Payment.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      DemoPayment__Scenario: ${DemoPayment__Scenario:-Success}
      DemoPayment__AuthorizationDelayMilliseconds: ${DemoPayment__AuthorizationDelayMilliseconds:-0}
    restart: unless-stopped
    ports:
      - "${PAYMENT_API_HOST_PORT:-15004}:8080"

  shipping-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Shipping/ECommerce.Shipping.Api/ECommerce.Shipping.Api.csproj
        ASSEMBLY_NAME: ECommerce.Shipping.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
    restart: unless-stopped
    ports:
      - "${SHIPPING_API_HOST_PORT:-15187}:8080"

  notification-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Notification/ECommerce.Notification.Api/ECommerce.Notification.Api.csproj
        ASSEMBLY_NAME: ECommerce.Notification.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_API_HOST_PORT:-15234}:8080"

  identity-api:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Identity/ECommerce.Identity.Api/ECommerce.Identity.Api.csproj
        ASSEMBLY_NAME: ECommerce.Identity.Api
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      Auth0Management__Enabled: ${Auth0Management__Enabled:-false}
      Auth0Management__Domain: ${Auth0Management__Domain:-}
      Auth0Management__ClientId: ${Auth0Management__ClientId:-}
      Auth0Management__ClientSecret: ${Auth0Management__ClientSecret:-}
      Auth0Management__CustomerRoleId: ${Auth0Management__CustomerRoleId:-}
      Auth0Management__SellerRoleId: ${Auth0Management__SellerRoleId:-}
      Auth0Management__TimeoutSeconds: ${Auth0Management__TimeoutSeconds:-10}
    restart: unless-stopped
    ports:
      - "${IDENTITY_API_HOST_PORT:-15090}:8080"

  ordering-saga-worker:
    build:
      <<: *build
      args:
        PROJECT: src/Services/OrderingSaga/ECommerce.OrderingSaga.Worker/ECommerce.OrderingSaga.Worker.csproj
        ASSEMBLY_NAME: ECommerce.OrderingSaga.Worker
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      OrderWorkflowTimeouts__InventorySeconds: ${ORDER_WORKFLOW_INVENTORY_TIMEOUT_SECONDS:-120}
      OrderWorkflowTimeouts__PaymentSeconds: ${ORDER_WORKFLOW_PAYMENT_TIMEOUT_SECONDS:-120}
      OrderWorkflowTimeouts__ShippingSeconds: ${ORDER_WORKFLOW_SHIPPING_TIMEOUT_SECONDS:-180}
      OrderWorkflowTimeouts__PollIntervalSeconds: ${ORDER_WORKFLOW_TIMEOUT_POLL_INTERVAL_SECONDS:-5}
      OrderWorkflowTimeouts__BatchSize: ${ORDER_WORKFLOW_TIMEOUT_BATCH_SIZE:-25}
    restart: unless-stopped
    ports:
      - "${ORDERING_SAGA_HOST_PORT:-15274}:8080"
    depends_on:
      inventory-api:
        condition: service_started
      payment-api:
        condition: service_started
      shipping-api:
        condition: service_started

  api-gateway:
    build:
      <<: *build
      args:
        PROJECT: src/ApiGateways/ECommerce.ApiGateway/ECommerce.ApiGateway.csproj
        ASSEMBLY_NAME: ECommerce.ApiGateway
    env_file: *env-file
    environment:
      <<: [*api-env, *managed-env]
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_HOST_PORT:-15080}:8080"
    depends_on:
      catalog-api:
        condition: service_started
      basket-api:
        condition: service_started
      ordering-api:
        condition: service_started
      inventory-api:
        condition: service_started
      payment-api:
        condition: service_started
      shipping-api:
        condition: service_started
      notification-api:
        condition: service_started
      identity-api:
        condition: service_started
      ordering-saga-worker:
        condition: service_started

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
